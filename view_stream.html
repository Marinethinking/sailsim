<!DOCTYPE html>
<html>
<head>
    <title>MediaMTX WebRTC Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1e1e1e;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #4CAF50;
        }
        .stream-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .stream-box {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .stream-box h3 {
            margin-top: 0;
            color: #4CAF50;
        }
        video {
            width: 100%;
            background: #000;
            border-radius: 4px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
        }
        .status.connected {
            background: #2d5a2d;
            color: #90ee90;
        }
        .status.disconnected {
            background: #5a2d2d;
            color: #ee9090;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MediaMTX WebRTC Stream Viewer</h1>
        <p>Connect to MediaMTX streams via WHEP (WebRTC-HTTP Egress Protocol)</p>
        
        <div class="stream-container">
            <div class="stream-box">
                <h3>Front Camera</h3>
                <video id="video-front" autoplay playsinline muted></video>
                <button onclick="connectStream('front', 'video-front')">Connect</button>
                <button onclick="disconnectStream('front')">Disconnect</button>
                <div id="status-front" class="status disconnected">Disconnected</div>
            </div>
            
            <div class="stream-box">
                <h3>Back Camera</h3>
                <video id="video-back" autoplay playsinline muted></video>
                <button onclick="connectStream('back', 'video-back')">Connect</button>
                <button onclick="disconnectStream('back')">Disconnect</button>
                <div id="status-back" class="status disconnected">Disconnected</div>
            </div>
            
            <div class="stream-box">
                <h3>Left Camera</h3>
                <video id="video-left" autoplay playsinline muted></video>
                <button onclick="connectStream('left', 'video-left')">Connect</button>
                <button onclick="disconnectStream('left')">Disconnect</button>
                <div id="status-left" class="status disconnected">Disconnected</div>
            </div>
            
            <div class="stream-box">
                <h3>Right Camera</h3>
                <video id="video-right" autoplay playsinline muted></video>
                <button onclick="connectStream('right', 'video-right')">Connect</button>
                <button onclick="disconnectStream('right')">Disconnect</button>
                <div id="status-right" class="status disconnected">Disconnected</div>
            </div>
        </div>
    </div>

    <script>
        const mediamtxUrl = 'http://localhost:8889';
        const peerConnections = {};
        const videoElements = {};

        async function connectStream(streamName, videoId) {
            if (peerConnections[streamName]) {
                console.log(`Stream ${streamName} already connected`);
                return;
            }

            const video = document.getElementById(videoId);
            videoElements[streamName] = video;
            updateStatus(streamName, 'Connecting...', false);

            try {
                // Request stream from MediaMTX (POST request to WHEP endpoint to initiate)
                // WHEP protocol: POST to initiate, server responds with offer
                const response = await fetch(`${mediamtxUrl}/${streamName}/whep`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/sdp'
                    },
                    body: '' // Empty body to request offer
                });

                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error(`Stream not found. Make sure Unity is publishing to MediaMTX and the stream name matches.`);
                    }
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const sdpOffer = await response.text();

                // Create peer connection
                const pc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                // Handle incoming video track
                pc.ontrack = (event) => {
                    console.log(`Received track for ${streamName}`, event.track);
                    video.srcObject = event.streams[0];
                    // Ensure playback starts even if autoplay doesn't trigger immediately
                    const tryPlay = () => {
                        const p = video.play();
                        if (p && typeof p.then === 'function') {
                            p.catch(err => console.warn(`video.play() blocked or failed:`, err));
                        }
                    };
                    if (video.readyState >= 1) {
                        tryPlay();
                    } else {
                        video.onloadedmetadata = () => tryPlay();
                    }
                    updateStatus(streamName, 'Connected', true);
                };

                pc.onconnectionstatechange = () => {
                    console.log(`${streamName} connection state:`, pc.connectionState);
                    if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                        updateStatus(streamName, 'Disconnected', false);
                        disconnectStream(streamName);
                    }
                };

                // Set remote description (MediaMTX's offer)
                await pc.setRemoteDescription({
                    type: 'offer',
                    sdp: sdpOffer
                });

                // Create answer
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                // Wait for ICE gathering
                await new Promise((resolve) => {
                    if (pc.iceGatheringState === 'complete') {
                        resolve();
                    } else {
                        pc.onicegatheringstatechange = () => {
                            if (pc.iceGatheringState === 'complete') {
                                resolve();
                            }
                        };
                    }
                });

                // Send answer back to MediaMTX (PATCH request)
                const answerSdp = pc.localDescription.sdp;
                const patchResponse = await fetch(`${mediamtxUrl}/${streamName}/whep`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/sdp'
                    },
                    body: answerSdp
                });

                if (!patchResponse.ok) {
                    throw new Error(`PATCH failed: ${patchResponse.status}`);
                }

                peerConnections[streamName] = pc;
                updateStatus(streamName, 'Connected', true);
                console.log(`Stream ${streamName} connected successfully`);

            } catch (error) {
                console.error(`Error connecting to ${streamName}:`, error);
                updateStatus(streamName, `Error: ${error.message}`, false);
                if (peerConnections[streamName]) {
                    peerConnections[streamName].close();
                    delete peerConnections[streamName];
                }
            }
        }

        function disconnectStream(streamName) {
            if (peerConnections[streamName]) {
                peerConnections[streamName].close();
                delete peerConnections[streamName];
            }
            if (videoElements[streamName]) {
                videoElements[streamName].srcObject = null;
            }
            updateStatus(streamName, 'Disconnected', false);
        }

        function updateStatus(streamName, message, connected) {
            const statusEl = document.getElementById(`status-${streamName}`);
            if (statusEl) {
                statusEl.textContent = message;
                statusEl.className = `status ${connected ? 'connected' : 'disconnected'}`;
            }
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            Object.keys(peerConnections).forEach(streamName => {
                disconnectStream(streamName);
            });
        });
    </script>
</body>
</html>
